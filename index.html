<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숨은 그림 찾기</title>

  <!-- Pretendard Variable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css"/>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: url("Paper.png") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Pretendard Variable', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 첫 화면 */
    #start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #start-screen img { max-width: 40%; }
    .start-btn { width: 300px; margin-top: 30px; cursor: pointer; transition: transform 0.2s ease; }
    .start-btn:hover { transform: scale(1.05); }

    /* 게임 화면 */
    #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; position: relative; }
    .timer { position: absolute; top: 15px; right: 40px; background: #39BAFF; color: #fff; font-weight: 800; font-size: 28px;
      padding: 12px 28px; border-radius: 100px; border: none; }
    .subtitle { margin: 20px 0; max-width: 40%; }

    .game-container { position: relative; width: 1040px; max-width: 95%; }
    .main-image { width: 100%; border-radius: 10px; }

    .circle { position: absolute; width: 70px; height: 70px; border: 4px solid white; border-radius: 50%; display: none; pointer-events: none; }
    .hotspot { position: absolute; width: 70px; height: 70px; cursor: pointer; background: transparent; }

    .options { display: flex; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; justify-content: center; }
    .options img { width: 100px; height: auto; }

    /* popup2 & popup3 */
    #popup2, #popup3 {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }
    #popup2 img, #popup3 img { max-width: 25%; height: auto; }
    #popup3 { cursor: pointer; }

    /* 결과 화면 */
    #result-screen {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100%; position: fixed; top: 0; left: 0;
      background: url("Paper.png") no-repeat center center fixed; background-size: cover;
    }
    #result-image { max-width: 20%; margin-bottom: 30px; }
    .result-buttons { display: flex; gap: 30px; justify-content: center; }
    .result-buttons img { width: 160px; cursor: pointer; transition: transform 0.2s ease; }
    .result-buttons img:hover { transform: scale(1.05); }

    /* 정답 화면 */
    #answer-screen {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100%; position: fixed; top: 0; left: 0;
      background: url("Paper.png") no-repeat center center fixed; background-size: cover;
    }
    #answer-screen img { width: 1040px; max-width: 95%; border-radius: 10px; margin-bottom: 30px; }
    .close-btn {
      background: #39BAFF; color: #fff; font-size: 24px; font-weight: 700;
      padding: 12px 30px; border-radius: 100px; cursor: pointer; border: none;
      transition: transform 0.2s ease;
    }
    .close-btn:hover { transform: scale(1.05); }
  </style>
</head>
<body>
  <!-- 첫 화면 -->
  <div id="start-screen">
    <img src="Title.png" alt="숨은 그림 찾기">
    <img src="Start.png" alt="시작하기 버튼" class="start-btn" onclick="startGame()">
  </div>

  <!-- 게임 화면 -->
  <div id="game-screen">
    <div class="timer" id="timer">60초</div>
    <img src="Subtitle.png" alt="문제 설명" class="subtitle">

    <div class="game-container">
      <img src="Before.png" alt="숨은 그림 원본" class="main-image">
      <!-- 원 -->
      <div id="circle1" class="circle" style="top: 50px; left: 240px;"></div>
      <div id="circle2" class="circle" style="top: 100px; left: 578px;"></div>
      <div id="circle3" class="circle" style="top: 4px; left: 760px;"></div>
      <div id="circle4" class="circle" style="top: 180px; left: 890px;"></div>
      <div id="circle5" class="circle" style="top: 470px; left: 520px;"></div>
      <!-- 핫스팟 -->
      <div class="hotspot" style="top: 50px; left: 240px;" onclick="showCircle(1)"></div>
      <div class="hotspot" style="top: 100px; left: 578px;" onclick="showCircle(2)"></div>
      <div class="hotspot" style="top: 4px; left: 760px;" onclick="showCircle(3)"></div>
      <div class="hotspot" style="top: 180px; left: 890px;" onclick="showCircle(4)"></div>
      <div class="hotspot" style="top: 470px; left: 520px;" onclick="showCircle(5)"></div>
    </div>

    <div class="options">
      <img src="1.png" alt="옵션 1">
      <img src="2.png" alt="옵션 2">
      <img src="3.png" alt="옵션 3">
      <img src="4.png" alt="옵션 4">
      <img src="5.png" alt="옵션 5">
    </div>
  </div>

  <!-- popup2 (5개 다 찾음) -->
  <div id="popup2"><img src="popup2.png" alt="정답 맞춤 팝업"></div>

  <!-- popup3 (시간 종료) -->
  <div id="popup3" onclick="showResult()"><img src="popup3.png" alt="시간 종료 팝업"></div>

  <!-- 결과 화면 -->
  <div id="result-screen">
    <img id="result-image" src="A1.png" alt="결과 이미지">
    <div class="result-buttons">
      <img src="Retry.png" alt="다시 하기" onclick="restartGame()">
      <img src="Answer.png" alt="정답 보기" onclick="showAnswer()">
    </div>
  </div>

  <!-- 정답 화면 -->
  <div id="answer-screen">
    <img src="After.png" alt="정답 이미지">
    <button class="close-btn" onclick="backToResult()">닫기</button>
  </div>

  <!-- 배경 음악 -->
  <audio id="bg-music" src="Music.mp3" loop></audio>

  <script>
    let countdown;
    let timeLeft = 60;
    let foundCircles = 0;

    function startGame() {
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("game-screen").style.display = "flex";
      document.getElementById("result-screen").style.display = "none";
      document.getElementById("answer-screen").style.display = "none";

      const music = document.getElementById("bg-music");
      music.play();

      const timerElement = document.getElementById("timer");
      timeLeft = 60;
      timerElement.textContent = timeLeft + "초";

      countdown = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft + "초";
        if (timeLeft <= 0) {
          clearInterval(countdown);
          timerElement.textContent = "0초";
          showPopup3();
        }
      }, 1000);
    }

    function showPopup2() {
      document.getElementById("popup2").style.display = "flex";
      setTimeout(() => { showResult(); }, 2000); // 2초 후 결과
    }

    function showPopup3() {
      document.getElementById("popup3").style.display = "flex";
    }

    function showResult() {
      document.getElementById("popup2").style.display = "none";
      document.getElementById("popup3").style.display = "none";

      // 찾은 개수별 결과 이미지 세팅
      const resultImage = document.getElementById("result-image");
      if (foundCircles >= 1 && foundCircles <= 5) {
        resultImage.src = "A" + foundCircles + ".png";
      } else {
        resultImage.src = "A1.png"; // 기본값
      }

      document.getElementById("result-screen").style.display = "flex";
    }

    function restartGame() {
      document.getElementById("result-screen").style.display = "none";
      document.getElementById("answer-screen").style.display = "none";
      document.getElementById("popup2").style.display = "none";
      document.getElementById("popup3").style.display = "none";
      document.getElementById("game-screen").style.display = "none";
      document.getElementById("start-screen").style.display = "flex";
      foundCircles = 0;
    }

    function showAnswer() {
      document.getElementById("result-screen").style.display = "none";
      document.getElementById("answer-screen").style.display = "flex";
    }

    function backToResult() {
      document.getElementById("answer-screen").style.display = "none";
      document.getElementById("result-screen").style.display = "flex";
    }

    function showCircle(num) {
      const circle = document.getElementById("circle" + num);
      if (circle.style.display !== "block") {
        circle.style.display = "block";
        foundCircles++;
        if (foundCircles === 5) {
          clearInterval(countdown);
          showPopup2(); // 5개 찾으면 popup2
        }
      }
    }
  </script>
</body>
</html>
